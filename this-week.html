<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>This Week - BudgetApp</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --muted: #94a3b8;
      --text: #e5e7eb;
      --ok: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
      --accent: #60a5fa;
      --border: #1f2937;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(180deg, #0b1220 0%, var(--bg) 100%);
      color: var(--text);
      padding: 24px;
    }
    .container { max-width: 980px; margin: 0 auto; }
    .header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
      gap: 10px; flex-wrap: wrap;
    }
    .header h1 { margin: 0; font-size: 1.8rem; }
    .nav a {
      color: var(--accent); text-decoration: none; margin-left: 14px;
      font-size: 0.95rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .card {
      background: rgba(17,24,39,0.9);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }
    .label { color: var(--muted); font-size: 0.8rem; margin-bottom: 6px; }
    .value { font-size: 1.5rem; font-weight: 700; }
    .status { font-weight: 700; margin-top: 10px; }
    .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
    .panel {
      background: rgba(17,24,39,0.9);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .panel h2 { margin: 0 0 10px; font-size: 1.05rem; }
    .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: end; height: 200px; }
    .bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .bar {
      width: 100%;
      max-width: 48px;
      background: linear-gradient(180deg, #3b82f6, #1d4ed8);
      border-radius: 8px 8px 4px 4px;
      min-height: 2px;
    }
    .day { color: var(--muted); font-size: 0.8rem; }
    .amt { font-size: 0.78rem; color: #cbd5e1; }
    @media (max-width: 820px) {
      .grid { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
    }
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      .bars { gap: 6px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>This Week</h1>
      <div class="nav">
        <a href="index.html">Home</a>
        <a href="groceries.html">Groceries</a>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="label">Weekly Budget</div>
        <div class="value" id="weeklyBudget">$0.00</div>
      </div>
      <div class="card">
        <div class="label">Spent So Far</div>
        <div class="value" id="spentSoFar">$0.00</div>
      </div>
      <div class="card">
        <div class="label">Remaining</div>
        <div class="value" id="remaining">$0.00</div>
      </div>
      <div class="card">
        <div class="label">Pace Target by Today</div>
        <div class="value" id="paceTarget">$0.00</div>
      </div>
    </div>

    <div class="panel">
      <h2>Pace Status</h2>
      <div id="paceStatus" class="status">Loading...</div>
      <div id="paceHint" class="label" style="margin-top:8px;"></div>
    </div>

    <div class="panel">
      <h2>Daily Spend (Mon–Sun)</h2>
      <div class="bars" id="bars"></div>
    </div>
  </div>

  <script>
    const WEEKLY_BUDGET_KEY = "weeklyBudget";
    const TRANSACTIONS_KEY = "transactions";

    if (!localStorage.getItem(WEEKLY_BUDGET_KEY)) {
      localStorage.setItem(WEEKLY_BUDGET_KEY, "600");
    }

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyulEmg-gesuCE_5S4jeeOr0kXk2-YZmrTietxFd0mXyAW-NnAhVmBfoIioyr1Dex7rEg/exec";

    const fmt = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });

    function getMonday(date = new Date()) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      d.setHours(0,0,0,0);
      return d;
    }

    function getSunday(monday) {
      const s = new Date(monday);
      s.setDate(s.getDate() + 6);
      s.setHours(23,59,59,999);
      return s;
    }

    function parseTxDate(value) {
      if (!value) return null;
      if (value instanceof Date && !isNaN(value)) return value;

      const s = String(value).trim();
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
      if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));

      const d = new Date(s);
      return isNaN(d.getTime()) ? null : d;
    }

    function normalizeTx(raw) {
      const amount = Number(raw.amount ?? raw.Amount ?? 0);
      const category = String(raw.category ?? raw.Category ?? '').trim();
      const note = raw.note ?? raw.Note ?? '';
      const date = raw.date ?? raw.Date ?? '';
      return { amount, category, note, date };
    }

    function inRange(dateValue, start, end) {
      const d = parseTxDate(dateValue);
      if (!d) return false;
      return d >= start && d <= end;
    }

    function loadLocalTransactions() {
      try { return JSON.parse(localStorage.getItem(TRANSACTIONS_KEY) || "[]").map(normalizeTx); }
      catch { return []; }
    }

    async function loadTransactions() {
      try {
        const response = await fetch(SCRIPT_URL);
        const result = await response.json();
        if (result.status === 'success' && Array.isArray(result.transactions)) {
          return result.transactions.map(normalizeTx);
        }
      } catch (e) {
        console.warn('Using local transactions fallback for This Week.', e);
      }
      return loadLocalTransactions();
    }

    async function render() {
      const weeklyBudget = Number(localStorage.getItem(WEEKLY_BUDGET_KEY) || 0);
      const transactions = await loadTransactions();

      const today = new Date();
      const monday = getMonday(today);
      const sunday = getSunday(monday);

      const thisWeekTx = transactions.filter(t => inRange(t.date, monday, sunday));
      const spentSoFar = thisWeekTx.reduce((sum, t) => sum + Number(t.amount || 0), 0);
      const remaining = weeklyBudget - spentSoFar;

      const jsDay = today.getDay();
      const dayIndex = jsDay === 0 ? 7 : jsDay;
      const paceTarget = (weeklyBudget / 7) * dayIndex;

      const statusEl = document.getElementById("paceStatus");
      const hintEl = document.getElementById("paceHint");

      let statusClass = "ok";
      let statusText = "On track ✅";
      if (spentSoFar > paceTarget * 1.1) {
        statusClass = "bad";
        statusText = "Over pace ⚠️";
      } else if (spentSoFar > paceTarget) {
        statusClass = "warn";
        statusText = "Slightly above pace";
      }

      document.getElementById("weeklyBudget").textContent = fmt.format(weeklyBudget);
      document.getElementById("spentSoFar").textContent = fmt.format(spentSoFar);
      document.getElementById("remaining").textContent = fmt.format(remaining);
      document.getElementById("paceTarget").textContent = fmt.format(paceTarget);
      statusEl.className = `status ${statusClass}`;
      statusEl.textContent = statusText;
      hintEl.textContent = `By today, target spend is ${fmt.format(paceTarget)}. Current spend is ${fmt.format(spentSoFar)}.`;

      const labels = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
      const daily = [0,0,0,0,0,0,0];

      thisWeekTx.forEach(t => {
        const d = parseTxDate(t.date);
        if (!d) return;
        const day = d.getDay();
        const idx = day === 0 ? 6 : day - 1;
        daily[idx] += Number(t.amount || 0);
      });

      const maxVal = Math.max(...daily, 1);
      const bars = document.getElementById("bars");
      bars.innerHTML = "";

      daily.forEach((amt, i) => {
        const wrap = document.createElement("div");
        wrap.className = "bar-wrap";

        const amtEl = document.createElement("div");
        amtEl.className = "amt";
        amtEl.textContent = fmt.format(amt);

        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.height = `${Math.max((amt / maxVal) * 160, 2)}px`;

        const dayEl = document.createElement("div");
        dayEl.className = "day";
        dayEl.textContent = labels[i];

        wrap.appendChild(amtEl);
        wrap.appendChild(bar);
        wrap.appendChild(dayEl);
        bars.appendChild(wrap);
      });
    }

    render();
  </script>
</body>
</html>
