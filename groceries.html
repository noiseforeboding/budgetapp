<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Groceries - BudgetApp</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --muted: #94a3b8;
      --text: #e5e7eb;
      --ok: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
      --accent: #34d399;
      --border: #1f2937;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(180deg, #0b1220 0%, var(--bg) 100%);
      color: var(--text);
      padding: 24px;
    }
    .container { max-width: 980px; margin: 0 auto; }
    .header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
      gap: 10px; flex-wrap: wrap;
    }
    .header h1 { margin: 0; font-size: 1.8rem; }
    .nav a {
      color: #7dd3fc; text-decoration: none; margin-left: 14px; font-size: 0.95rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .card {
      background: rgba(17,24,39,0.9);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }
    .label { color: var(--muted); font-size: 0.8rem; margin-bottom: 6px; }
    .value { font-size: 1.45rem; font-weight: 700; }
    .panel {
      background: rgba(17,24,39,0.9);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .progress {
      width: 100%; background: #0b1220; border: 1px solid var(--border); border-radius: 999px;
      height: 16px; overflow: hidden; margin-top: 10px;
    }
    .progress > div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #34d399, #10b981);
      transition: width .25s ease;
    }
    table {
      width: 100%; border-collapse: collapse; margin-top: 8px; font-size: .95rem;
    }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #243042; }
    th { color: #cbd5e1; font-weight: 600; }
    .tag {
      border: 1px solid #35556f; padding: 2px 8px; border-radius: 999px; color: #c7e7ff; font-size: .78rem;
    }
    @media (max-width: 820px) {
      .grid { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
    }
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Groceries</h1>
      <div class="nav">
        <a href="index.html">Home</a>
        <a href="this-week.html">This Week</a>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="label">Grocery Budget (Monthly)</div>
        <div class="value" id="groceryBudget">$0.00</div>
      </div>
      <div class="card">
        <div class="label">Spent This Month</div>
        <div class="value" id="spentMonth">$0.00</div>
      </div>
      <div class="card">
        <div class="label">Remaining</div>
        <div class="value" id="remaining">$0.00</div>
      </div>
      <div class="card">
        <div class="label">% of Total Spend</div>
        <div class="value" id="percentTotal">0%</div>
      </div>
    </div>

    <div class="panel">
      <div class="label">Budget Usage</div>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="label" id="usageText" style="margin-top:8px;"></div>
    </div>

    <div class="panel">
      <h2 style="margin-top:0;">Recent Grocery Transactions</h2>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Note</th>
            <th>Category</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody id="txRows"></tbody>
      </table>
    </div>
  </div>

  <script src="app-data.js"></script>
  <script>
    const GROCERY_BUDGET_KEY = "groceryBudgetMonthly";
    const TRANSACTIONS_KEY = "transactions";

    if (!localStorage.getItem(GROCERY_BUDGET_KEY)) {
      localStorage.setItem(GROCERY_BUDGET_KEY, "450");
    }
    if (!localStorage.getItem(TRANSACTIONS_KEY)) {
      const demo = [
        { id: "1", date: "2026-07-03", amount: 72.15, category: "Groceries", note: "Weekly shop" },
        { id: "2", date: "2026-07-08", amount: 31.99, category: "Dining", note: "Lunch" },
        { id: "3", date: "2026-07-12", amount: 64.80, category: "Groceries", note: "Costco" },
        { id: "4", date: "2026-07-19", amount: 29.45, category: "Groceries", note: "Top-up" },
        { id: "5", date: "2026-07-24", amount: 56.20, category: "Groceries", note: "Produce + dairy" }
      ];
      localStorage.setItem(TRANSACTIONS_KEY, JSON.stringify(demo));
    }

    const fmt = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });

    function toAmount(value) {
      const num = Number(value);
      return Number.isFinite(num) ? num : 0;
    }

    function isGroceriesCategory(value) {
      return String(value || "").trim().toLowerCase() === "groceries";
    }

    async function init() {
      const groceryBudget = Number(localStorage.getItem(GROCERY_BUDGET_KEY) || 0);
      const loaded = await AppData.loadTransactionsAndBudgets({
        scriptUrl: AppData.SCRIPT_URL,
        localStorageKey: TRANSACTIONS_KEY
      });

      const allTx = loaded.transactions;
      const monthTx = AppData.filterMonth(allTx);
      const groceryTx = allTx.filter((t) => isGroceriesCategory(t.category));
      const groceryMonthTx = monthTx.filter((t) => isGroceriesCategory(t.category));

      const spentMonth = groceryMonthTx.reduce((sum, t) => sum + toAmount(t.amount), 0);
      const totalMonthAllCategories = monthTx.reduce((sum, t) => sum + toAmount(t.amount), 0);

      const remaining = groceryBudget - spentMonth;
      const pctUsed = groceryBudget > 0 ? (spentMonth / groceryBudget) * 100 : 0;
      const pctOfTotal = totalMonthAllCategories > 0 ? (spentMonth / totalMonthAllCategories) * 100 : 0;

      document.getElementById("groceryBudget").textContent = fmt.format(groceryBudget);
      document.getElementById("spentMonth").textContent = fmt.format(spentMonth);
      document.getElementById("remaining").textContent = fmt.format(remaining);
      document.getElementById("percentTotal").textContent = `${pctOfTotal.toFixed(1)}%`;

      const bar = document.getElementById("progressBar");
      bar.style.width = `${Math.min(pctUsed, 100)}%`;
      bar.style.background = pctUsed > 100
        ? "linear-gradient(90deg, #fb7185, #ef4444)"
        : pctUsed > 85
        ? "linear-gradient(90deg, #fbbf24, #f59e0b)"
        : "linear-gradient(90deg, #34d399, #10b981)";

      document.getElementById("usageText").textContent =
        `${fmt.format(spentMonth)} of ${fmt.format(groceryBudget)} used (${pctUsed.toFixed(1)}%)`;

      const rows = document.getElementById("txRows");
      const recent = [...groceryTx]
        .sort((a, b) => {
          const aDate = AppData.parseTxDate(a.date);
          const bDate = AppData.parseTxDate(b.date);
          return (bDate ? bDate.getTime() : 0) - (aDate ? aDate.getTime() : 0);
        })
        .slice(0, 5);

      if (recent.length === 0) {
        rows.innerHTML = `<tr><td colspan="4" style="color:#94a3b8;">No grocery transactions yet.</td></tr>`;
      } else {
        rows.innerHTML = recent.map((t) => `
          <tr>
            <td>${t.date || "-"}</td>
            <td>${t.note || "-"}</td>
            <td><span class="tag">${t.category || "Groceries"}</span></td>
            <td>${fmt.format(toAmount(t.amount))}</td>
          </tr>
        `).join("");
      }
    }

    init().catch((err) => {
      console.error("Failed to load grocery data", err);
      document.getElementById("usageText").textContent = "Unable to load grocery data.";
      document.getElementById("txRows").innerHTML = `<tr><td colspan="4" style="color:#94a3b8;">Unable to load transactions.</td></tr>`;
    });
  </script>
</body>
</html>
